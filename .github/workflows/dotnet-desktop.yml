name: .NET Desktop Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    env:
      Solution_Name: GithubLauncher.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore GithubLauncher.sln

    - name: Publish Windows x64
      run: dotnet publish GithubLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/win-x64

    - name: Upload Windows x64
      uses: actions/upload-artifact@v4
      with:
        name: GithubLauncher-Windows-x64
        path: publish/win-x64
        retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    
    env:
      Solution_Name: GithubLauncher.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore GithubLauncher.sln

    - name: Publish Linux x64
      run: dotnet publish GithubLauncher.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-x64

    - name: Publish Linux ARM64
      run: dotnet publish GithubLauncher.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-arm64

    - name: Upload Linux x64
      uses: actions/upload-artifact@v4
      with:
        name: GithubLauncher-Linux-x64
        path: publish/linux-x64
        retention-days: 14

    - name: Upload Linux ARM64
      uses: actions/upload-artifact@v4
      with:
        name: GithubLauncher-Linux-ARM64
        path: publish/linux-arm64
        retention-days: 14

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install native controller library
        run: brew install sdl2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Validate through Overcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bundle exec overcommit --install
          bundle exec overcommit --sign
          bundle exec overcommit --sign pre-commit
          bundle exec overcommit --run
      - name: Build macOS app
        run: bash scripts/build-macos.sh ${{ matrix.runtime }}
      - name: Preserve app bundle metadata
        run: ditto -c -k --sequesterRsrc --keepParent publish/GithubLauncher-Mac.app publish/GithubLauncher-${{ matrix.runtime }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GithubLauncher-${{ matrix.runtime }}
          path: publish/GithubLauncher-${{ matrix.runtime }}.zip
          retention-days: 14
